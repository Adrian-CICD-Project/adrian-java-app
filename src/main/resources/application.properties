spring.application.name=devops-project
server.port=8080
logging.level.root=info
logging.level.com.example.devops_project=debug

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

# Sondy Kubernetes: /actuator/health/liveness i /actuator/health/readiness
management.endpoint.health.probes.enabled=true

# Tag do metryk (żeby łatwiej filtrować w PromQL)
management.metrics.tags.application=devops-project

# Histogramy latencji HTTP (percentyle p95/p99 w Grafanie)
management.metrics.distribution.percentiles-histogram.http_server_requests=true

# Sabotaż readiness przez chaos endpoint wpięty w grupę readiness
management.endpoint.health.group.readiness.include=readinessState,coffeeMachine

# Chaos engineering — limity bezpieczeństwa endpointów /api/chaos/**
coffee.chaos.enabled=true
coffee.chaos.max-delay-ms=10000
coffee.chaos.max-memory-mb=200
coffee.chaos.max-cpu-seconds=60
coffee.chaos.max-cpu-threads=4

